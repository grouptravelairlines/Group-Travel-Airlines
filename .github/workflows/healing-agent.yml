name: Healing Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase SDK
        run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save firebase

      - name: Run Healing Agent
        run: node scripts/healing-agent.mjs

      - name: Commit healed changes
        run: |
          git config user.name "Healing Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            robots.txt \
            sitemap.xml \
            index.html \
            blog/index.html \
            post.html \
            admin.html \
            blog

          if git diff --cached --quiet; then
            echo "Healing Agent: no changes required."
            exit 0
          fi

          git commit -m "Healing Agent: repair SEO and blog pages"
          git push
